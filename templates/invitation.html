<div
  id="opening-overlay"
  class="opening-overlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="opening-overlay-title"
>
  <div class="opening-flap opening-flap--top" aria-hidden="true">
    <span class="opening-flap__botanical opening-flap__botanical--left"></span>
  </div>

  <button
    type="button"
    class="opening-seal"
    id="opening-seal"
    aria-label="Siegel antippen, um die Einladung zu öffnen"
  >
    <img
      class="opening-seal__img"
      src="assets/wachsiegel2.png"
      alt=""
      width="150"
      height="150"
      decoding="async"
    />
  </button>

  <div class="opening-flap opening-flap--bottom" aria-hidden="true">
    <span class="opening-flap__botanical opening-flap__botanical--right"></span>
  </div>
</div>
