<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Erim & Besa Hochzeit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css" />
    <script src="scripts/envelope-animation.js" defer></script>
  </head>
  
  <body>
    <!-- Intro Container: Envelope + Swan -->
    <div class="intro-container" id="intro-container">
      <div class="swan-section" id="swan-section">
        <!-- Swan-Hintergrund wird per CSS gesetzt -->
      </div>
      
      <div
        id="invitation-envelope"
        class="invitation-envelope"
        role="dialog"
        aria-modal="true"
        aria-labelledby="invitation-envelope-title"
      >
        <div class="opening-flap opening-flap--top" aria-hidden="true">
          <span class="invitation-envelope__botanical invitation-envelope__botanical--left"></span>
        </div>
        <button
          type="button"
          class="opening-seal"
          id="opening-seal"
          aria-label="Siegel antippen, um die Einladung zu öffnen"
        >
          <img
            class="opening-seal__img"
            src="assets/wachsiegel2.png"
            alt=""
            width="150"
            height="150"
            decoding="async"
          />
        </button>
        <div class="opening-flap opening-flap--bottom" aria-hidden="true">
          <span class="invitation-envelope__botanical invitation-envelope__botanical--right"></span>
        </div>
      </div>
    </div>

    <!-- Main Content: Wird nach Klick sichtbar -->
    <main id="main" class="site-main" tabindex="-1" aria-label="Einladung" style="display: none;">
      <!-- Audio: Swan Lake (spielt nach Envelope-Öffnen) -->
      <audio id="swan-audio" preload="auto">
        <source src="assets/Tchaikovsky-Swan-Lake-audio.mp3" type="audio/mpeg">
      </audio>
      
      <!-- Language Switcher -->
      <div class="language-switcher">
        <button class="lang-btn lang-btn-sq active" onclick="switchLanguage('sq')">SQ</button>
        <button class="lang-btn lang-btn-de" onclick="switchLanguage('de')">DE</button>
        <button class="lang-btn lang-btn-en" onclick="switchLanguage('en')">EN</button>
        <button class="lang-btn lang-btn-tr" onclick="switchLanguage('tr')">TR</button>
      </div>
      <section class="hero-container" id="hero-container">
        <div class="invitation-section" id="invitation-section">
          <div class="invitation-content">
            <div class="invitation-image-wrapper">
              <img src="assets/Hochzeitsladung-sq.svg" alt="Hochzeitseinladung" class="kranz-with-title-svg" id="invitation-image">
            </div>
          </div>

          <!-- Scroll-Down-Pfeil -->
          <div class="scroll-down" aria-hidden="true">
            <span class="scroll-text">Scroll down</span>
            <span class="arrow arrow1"></span>
            <span class="arrow arrow2"></span>
          </div>
        </div>
      </section>

      <section class="details" id="details">
        <div class="grid">
          <article class="card">
            <h2 id="data-title">Data &amp; Ora</h2>
            <div class="detail-line">
              <span class="detail-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
              </span>
              <span class="detail-text" id="data-text1">E shtunë, 20 qershor 2026</span>
            </div>
            <div class="detail-line">
              <span class="detail-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
              </span>
              <span class="detail-text" id="data-text2">Takimi 20:00 deri 20:15</span>
            </div>
            <div class="detail-line">
              <span class="detail-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.86 19.86 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.86 19.86 0 0 1 2.08 4.18 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.72c.03.25.05.5.08.74a2 2 0 0 1-.45 2.11L8.09 8.91a16 16 0 0 0 6 6l1.48-1.48a2 2 0 0 1 2.11-.45c.24.03.49.05.73.08A2 2 0 0 1 22 16.92z"/></svg>
              </span>
              <span class="detail-text" id="data-text4">Na konfirmoni ardhjen tuaj<br>+389 78 357 003</span>
            </div>
            <div class="detail-line">
              <span class="detail-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a4.5 4.5 0 0 0-6.4 0L12 6.9l-2.4-2.3a4.5 4.5 0 1 0-6.4 6.4l2.3 2.4L12 21.3l6.5-6.5 2.3-2.4a4.5 4.5 0 0 0 0-6.4z"/></svg>
              </span>
              <span class="detail-text" id="data-text5">Ju mirëpresim!</span>
            </div>
          </article>
          <article class="card">
            <h2>Restoranti &amp; Lokacioni</h2>
            <p>Fish House Delfin</p>
            <div class="map-wrapper">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3035.4770290388576!2d20.979286915083413!3d41.85632927925709!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1353fdc41cffd9bf%3A0x65f994468a9a8cbd!2sFish%20House%20Delfin!5e0!3m2!1sde!2sde!4v1700000000000!5m2!1sde!2sde"
            width="600"
            height="340"
            style="border:0;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            title="Fish House Delfin Location"
          ></iframe>
        </div>
          </article>
          
        </div>
      </section>
    </main>

    </body>
    <script>
      const translations = {
            sq: {
                dataTitle: "Data & Ora",
                dataText1: "E shtunë, 20 qershor 2026",
                dataText2: "Takimi 20:00 deri 20:15",
                dataText4: "Na konfirmoni ardhjen tuaj +389 78 357 003",
                dataText5: "Ju mirëpresim!",
                locationTitle: "Restoranti & Lokacioni",
                locationText: "Fish House Delfin",
                image: "assets/Hochzeitsladung-sq.svg"
            },
            en: {
                dataTitle: "Date & Time",
                dataText1: "Saturday, June 20, 2026",
                dataText2: "Meet at 20:00 to 20:15",
                dataText4: "Please confirm your attendance +389 78 357 003",
                dataText5: "We look forward to welcoming you!",
                locationTitle: "Restaurant & Location",
                locationText: "Fish House Delfin",
                image: "assets/Hochzeitsladung-en.svg"
            },
            tr: {
                dataTitle: "Tarih & Saat",
                dataText1: "Cumartesi, 20 Haziran 2026",
                dataText2: "Toplantı 20:00'den 20:15'e",
                dataText4: "Lütfen katılımınızı onaylayın +389 78 357 003",
                dataText5: "Sizi bekliyoruz!",
                locationTitle: "Restoran & Konum",
                locationText: "Fish House Delfin",
                image: "assets/Hochzeitsladung-tr.svg"
            },
            de: {
                dataTitle: "Datum & Uhrzeit",
                dataText1: "Samstag, 20. Juni 2026",
                dataText2: "Treffen 20:00 bis 20:15 Uhr",
                dataText4: "Bitte bestätigt Eure Teilnahme +389 78 357 003",
                dataText5: "Wir freuen uns auf Euch!",
                locationTitle: "Restaurant & Location",
                locationText: "Fish House Delfin",
                image: "assets/Hochzeitsladung-de.svg"
            }
        };

        let currentLang = 'sq';

        // Sprache wechseln
        function switchLanguage(lang) {
            currentLang = lang;
            updateTexts();
            updateButtonStates();
        }

        // Button-Zustände aktualisieren
        function updateButtonStates() {
            document.querySelector('.lang-btn-sq').classList.toggle('active', currentLang === 'sq');
            document.querySelector('.lang-btn-en').classList.toggle('active', currentLang === 'en');
            document.querySelector('.lang-btn-tr').classList.toggle('active', currentLang === 'tr');
            document.querySelector('.lang-btn-de').classList.toggle('active', currentLang === 'de');
        }

        // Texte und Bild aktualisieren
        function updateTexts() {
            const t = translations[currentLang];
            
            // Cards aktualisieren
            const cards = document.querySelectorAll('.details .card');
            if (cards.length >= 2) {
                const dateCard = cards[0];
                dateCard.querySelector('h2').textContent = t.dataTitle;
                dateCard.querySelector('#data-text1').textContent = t.dataText1;
                dateCard.querySelector('#data-text2').textContent = t.dataText2;
                dateCard.querySelector('#data-text4').textContent = t.dataText4;
                dateCard.querySelector('#data-text5').textContent = t.dataText5;
                
                const locationCard = cards[1];
                locationCard.querySelector('h2').textContent = t.locationTitle;
                const locationP = locationCard.querySelector('p');
                if (locationP) {
                    locationP.textContent = t.locationText;
                }
            }
            
            // Bild mit Fade-Animation wechseln
            const img = document.getElementById('invitation-image');
            if (img && img.src !== t.image) {
                img.classList.add('fade-out');
                setTimeout(() => {
                    img.src = t.image;
                    img.classList.remove('fade-out');
                    img.classList.add('fade-in');
                    setTimeout(() => {
                        img.classList.remove('fade-in');
                    }, 300);
                }, 300);
            }
        }
    </script>
</html>
